name: Unlock a key

on:
  workflow_dispatch:
    inputs:
      key:
        description: Key to unlock
        required: true
        type: choice
        options:
          - test1
          - test2

permissions:
  contents: write

jobs:
  unlock:
    name: Unlock ${{ inputs.key }}
    runs-on: ubuntu-latest
    steps:
      - uses: suzuki-shunsuke/lock-action@4a69996f86294a4eacc7450392eb70804b6543c4 # v0.2.0
        with:
          mode: unlock
          key: ${{ inputs.key }}
          message: Unlocked by ${{ github.actor }} (run ${{ github.run_id }})
