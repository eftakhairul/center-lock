name: Check lock
description: Check whether a key is locked in eftakhairul/center-lock

inputs:
  key:
    description: Lock key to check
    required: true
  token:
    description: Token with contents access to eftakhairul/center-lock
    required: true
  fail_if_locked:
    description: Fail the step if the key is locked
    required: false
    default: "false"

outputs:
  locked:
    description: Whether the key is locked
    value: ${{ steps.lock.outputs.locked }}

runs:
  using: composite
  steps:
    - id: lock
      uses: suzuki-shunsuke/lock-action@4a69996f86294a4eacc7450392eb70804b6543c4 # v0.2.0
      with:
        mode: check
        key: ${{ inputs.key }}
        fail_if_locked: ${{ inputs.fail_if_locked }}
        repo_owner: eftakhairul
        repo_name: center-lock
        github_token: ${{ inputs.token }}
