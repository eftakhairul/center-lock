name: Unlock all keys

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unlock:
    name: Unlock ${{ matrix.key }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        key: [test1, test2]
    steps:
      - uses: suzuki-shunsuke/lock-action@4a69996f86294a4eacc7450392eb70804b6543c4 # v0.2.0
        with:
          mode: unlock
          key: ${{ matrix.key }}
          message: Unlocked by ${{ github.actor }} (run ${{ github.run_id }})
